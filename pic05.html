<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Wedding of Arin & Dito</title>

  <!-- Google Fonts: Gabarito, Lato, & Cinzel Decorative -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Gabarito:wght@600&family=Lato:ital,wght@0,300;0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">

  <style>
    /* =========================================================
       1. DEKLARASI FONT CUSTOM
       ========================================================= */
    @font-face {
      font-family: 'BarokahSignature';
      src: url('font/font/BarokahSignatureRegular-PK15Z.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }

    @font-face {
      font-family: 'Sansilk';
      src: url('font/font/Sansilk-p71dD.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }

    /* =========================================================
       2. RESET & STYLES DASAR
       ========================================================= */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #111111;
      font-family: 'Lato', sans-serif;
      color: #ffffff;
      overflow-x: hidden;
    }

    .mobile-container {
      width: 100%;
      min-height: 100vh;
      margin: 0 auto;
      position: relative;
    }

    /* Animasi Transisi Fade Cover */
    .fade-in {
      animation: fadeIn 0.8s ease-in-out forwards;
    }

    .fade-out {
      animation: fadeOut 0.8s ease-in-out forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.98); }
      to { opacity: 1; transform: scale(1); }
    }

    @keyframes fadeOut {
      from { opacity: 1; transform: scale(1); }
      to { opacity: 0; transform: scale(1.02); visibility: hidden; }
    }

    /* =========================================================
       3. STYLES SECTION 1: SAMPUL / COVER
       ========================================================= */
    #section-cover {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      z-index: 999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 24px 16px;
      background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.7)),
                  url('background/pic05.jpg') center/cover no-repeat;
    }

    .cover-content {
      width: 100%;
      max-width: 420px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .text-the-wedding {
      font-family: 'BarokahSignature', cursive, sans-serif;
      color: #ffffff;
      font-size: 14px; 
      letter-spacing: 1px;
      white-space: nowrap;
      margin-bottom: 8px;
    }

    .text-mempelai {
      font-family: 'Gabarito', sans-serif;
      font-weight: 600;
      font-size: 35px; 
      letter-spacing: 1px;
      white-space: nowrap;
      background: linear-gradient(135deg, #ffffff 0%, #e0e0e0 50%, #9e9e9e 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 70px;
    }

    .text-kepada {
      font-family: 'Lato', sans-serif;
      font-weight: 500;
      color: #ffffff;
      font-size: 11px; 
      white-space: nowrap;
      margin-bottom: 6px;
    }

    .text-tamu {
      font-family: 'Lato', sans-serif;
      font-weight: 700;
      color: #ffffff;
      font-size: 14px; 
      white-space: nowrap;
      margin-bottom: 8px;
      text-transform: capitalize;
    }

    .text-maaf {
      font-family: 'Lato', sans-serif;
      font-style: italic;
      color: #ffffff;
      font-size: 9px; 
      white-space: nowrap;
      opacity: 0.9;
    }

    .btn-open {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 24px;
      border: none;
      border-radius: 30px;
      color: #ffffff;
      font-family: 'Lato', sans-serif;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 0.5px;
      cursor: pointer;
      outline: none;
      margin-top: 120px;
      background: linear-gradient(270deg, #4a4a4a, #8a8a8a, #2c2c2c, #707070);
      background-size: 300% 300%;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .btn-open:active {
      transform: scale(0.95);
      animation: gradientMove 0.6s ease infinite;
    }

    .leaf-icon {
      width: 16px;
      height: 16px;
      fill: none;
      stroke: #ffffff;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    @keyframes gradientMove {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* =========================================================
       4. CONTAINER MAIN CONTENT & BACKGROUND SLIDER FIXED
       ========================================================= */
    #main-content {
      display: none;
      width: 100%;
      min-height: 100vh;
      position: relative;
    }

    /* SLIDER BACKGROUND TETAP (FIXED) LAYAR UTAMA */
    .bg-slider-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      overflow: hidden;
      pointer-events: none;
    }

    .bg-slider-container::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.15);
      z-index: 2;
    }

    .bg-slider-track {
      display: flex;
      width: 400vw;
      height: 100%;
      animation: slideLoop 28s linear infinite;
    }

    .bg-slide {
      width: 100vw;
      height: 100%;
      background-size: cover;
      background-position: center;
      flex-shrink: 0;
    }

    .bg-slide-1 { background-image: url('background/pic05-1.jpg'); }
    .bg-slide-2 { background-image: url('background/pic05-2.jpg'); }
    .bg-slide-3 { background-image: url('background/pic05-3.jpg'); }

    @keyframes slideLoop {
      0% { transform: translateX(0); }
      100% { transform: translateX(-300vw); }
    }

    /* =========================================================
       5. STYLES SEGMEN 2: HERO / WELCOME SECTION
       ========================================================= */
    #section-welcome {
      position: relative;
      z-index: 5;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 30px 20px;
    }

    .welcome-content {
      position: relative;
      width: 100%;
      max-width: 420px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-evenly;
      height: 85%;
    }

   /* Lanjutan .text-welcome yang terpotong */
    .text-welcome {
      font-family: 'Lato', sans-serif;
      font-size: 14px;
      color: #ffffff;
    }
  </style>
</head>
<body>

  <!-- Konten Utama Anda di sini -->
  <div class="mobile-container">
    <!-- ... -->
  </div>

  <script>
    // Script JavaScript Anda untuk membuka undangan (jika ada)
  </script>
</body>
</html>
