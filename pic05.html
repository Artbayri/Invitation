  <style>
    /* =========================================================
       1. DEKLARASI FONT CUSTOM
       ========================================================= */
    @font-face {
      font-family: 'BarokahSignature';
      src: url('font/font/BarokahSignatureRegular-PK15Z.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }

    @font-face {
      font-family: 'Sansilk';
      src: url('font/font/Sansilk-p71dD.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }

    /* =========================================================
       2. RESET & STYLES DASAR
       ========================================================= */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #111111;
      font-family: 'Lato', sans-serif;
      color: #ffffff;
      overflow-x: hidden;
    }

    .mobile-container {
      width: 100%;
      min-height: 100vh;
      margin: 0 auto;
      position: relative;
    }

    /* Animasi Transisi Fade Cover */
    .fade-in {
      animation: fadeIn 1s ease-in-out forwards;
    }

    .fade-out {
      animation: fadeOut 0.8s ease-in-out forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.98); }
      to { opacity: 1; transform: scale(1); }
    }

    @keyframes fadeOut {
      from { opacity: 1; transform: scale(1); }
      to { opacity: 0; transform: scale(1.02); visibility: hidden; }
    }

       3. STYLES SECTION 1: SAMPUL / COVER (FULL SCREEN)
