<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Wedding of Arin & Dito</title>

  <!-- Google Fonts: Gabarito & Lato -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gabarito:wght@600&family=Lato:ital,wght@0,300;0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">

  <style>
    /* =========================================================
       1. DEKLARASI FONT CUSTOM
       ========================================================= */
    @font-face {
      font-family: 'BarokahSignature';
      src: url('font/font/BarokahSignatureRegular-PK15Z.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }

    @font-face {
      font-family: 'Sansilk';
      src: url('font/font/Sansilk-p71dD.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }

    /* =========================================================
       2. RESET & STYLES DASAR
       ========================================================= */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #111111;
      font-family: 'Lato', sans-serif;
      color: #ffffff;
      overflow-x: hidden;
    }

    .mobile-container {
      width: 100%;
      min-height: 100vh;
      margin: 0 auto;
      position: relative;
    }

    /* Animasi Transisi Fade Cover */
    .fade-in {
      animation: fadeIn 1s ease-in-out forwards;
    }

    .fade-out {
      animation: fadeOut 0.8s ease-in-out forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.98); }
      to { opacity: 1; transform: scale(1); }
    }

    @keyframes fadeOut {
      from { opacity: 1; transform: scale(1); }
      to { opacity: 0; transform: scale(1.02); visibility: hidden; }
    }

    /* =========================================================
       3. STYLES SECTION 1: SAMPUL / COVER
       ========================================================= */
    #section-cover {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      z-index: 999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 24px 16px;
      background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.7)),
                  url('background/pic05.jpg') center/cover no-repeat;
    }

    .cover-content {
      width: 100%;
      max-width: 420px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .text-the-wedding {
      font-family: 'BarokahSignature', cursive, sans-serif;
      color: #ffffff;
      font-size: 14px; 
      letter-spacing: 1px;
      white-space: nowrap;
      margin-bottom: 8px;
    }

    .text-mempelai {
      font-family: 'Gabarito', sans-serif;
      font-weight: 600;
      font-size: 35px; 
      letter-spacing: 1px;
      white-space: nowrap;
      background: linear-gradient(135deg, #ffffff 0%, #e0e0e0 50%, #9e9e9e 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 70px;
    }

    .text-kepada {
      font-family: 'Lato', sans-serif;
      font-weight: 500;
      color: #ffffff;
      font-size: 11px; 
      white-space: nowrap;
      margin-bottom: 6px;
    }

    .text-tamu {
      font-family: 'Lato', sans-serif;
      font-weight: 700;
      color: #ffffff;
      font-size: 14px; 
      white-space: nowrap;
      margin-bottom: 8px;
      text-transform: capitalize;
    }

    .text-maaf {
      font-family: 'Lato', sans-serif;
      font-style: italic;
      color: #ffffff;
      font-size: 9px; 
      white-space: nowrap;
      opacity: 0.9;
    }

    .btn-open {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 24px;
      border: none;
      border-radius: 30px;
      color: #ffffff;
      font-family: 'Lato', sans-serif;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 0.5px;
      cursor: pointer;
      outline: none;
      margin-top: 120px;
      background: linear-gradient(270deg, #4a4a4a, #8a8a8a, #2c2c2c, #707070);
      background-size: 300% 300%;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .btn-open:active {
      transform: scale(0.95);
      animation: gradientMove 0.6s ease infinite;
    }

    .leaf-icon {
      width: 16px;
      height: 16px;
      fill: none;
      stroke: #ffffff;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    @keyframes gradientMove {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* =========================================================
       4. CONTAINER MAIN CONTENT
       ========================================================= */
    #main-content {
      display: none;
      width: 100%;
      min-height: 100vh;
    }

    /* =========================================================
       5. STYLES SEGMEN 2: HERO / WELCOME SECTION
       ========================================================= */
    #section-welcome {
      position: relative;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 30px 20px;
      overflow: hidden;
    }

    /* SLIDER BACKGROUND LOOP (Diatur Sedang: 28 Detik) */
    .bg-slider-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100%;
      z-index: 1;
      overflow: hidden;
    }

    .bg-slider-container::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.15); /* Kegelapan 15% */
      z-index: 2;
    }

    .bg-slider-track {
      display: flex;
      width: 400vw;
      height: 100%;
      animation: slideLoop 28s linear infinite; /* Kecepatan sedang */
    }

    .bg-slide {
      width: 100vw;
      height: 100%;
      background-size: cover;
      background-position: center;
      flex-shrink: 0;
    }

    .bg-slide-1 { background-image: url('background/pic05-1.jpg'); }
    .bg-slide-2 { background-image: url('background/pic05-2.jpg'); }
    .bg-slide-3 { background-image: url('background/pic05-3.jpg'); }

    @keyframes slideLoop {
      0% { transform: translateX(0); }
      100% { transform: translateX(-300vw); }
    }

    /* KONTEN UTAMA SEGMEN 2 */
    .welcome-content {
      position: relative;
      z-index: 3;
      width: 100%;
      max-width: 420px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-evenly;
      height: 85%;
    }

    .text-welcome {
      font-family: 'Lato', sans-serif;
      font-weight: 300;
      font-size: 15px;
      color: #ffffff;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    /* Teks Arin & Dito: Normal (Tidak Bold), 35px */
    .text-nama-sansilk {
      font-family: 'Sansilk', cursive, sans-serif;
      font-weight: normal; /* Tidak Bold */
      font-size: 35px; /* Ukuran 35px */
      line-height: 1.2;
      background: linear-gradient(270deg, #ffffff, #b0b0b0, #d6d6d6, #808080);
      background-size: 300% 300%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: gradientMove 4s ease infinite;
      margin: 10px 0;
    }

    /* Ornamen Garis-Daun-Garis */
    .ornament-divider {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 80%;
      margin: 15px 0;
    }

    .ornament-line {
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.8), transparent);
    }

    /* SVG Daun Sesuai Gambar Referensi */
    .ornament-leaf-svg {
      width: 24px;
      height: 28px;
      fill: none;
      stroke: #ffffff;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .text-pembuka {
      font-family: 'Lato', sans-serif;
      font-weight: 500;
      font-size: 11px;
      color: #ffffff;
      line-height: 1.8;
      letter-spacing: 0.5px;
      padding: 0 10px;
    }

    /* ANIMASI SCROLL FADE IN / OUT */
    .scroll-fade {
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.8s ease-out, transform 0.8s ease-out;
    }

    .scroll-fade.is-visible {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>

  <div class="mobile-container">

    <!-- SEGMEN 1: COVER / SAMPUL UNDANGAN -->
    <section id="section-cover" class="fade-in">
      <div class="cover-content">
        <div class="text-the-wedding">The Wedding</div>
        <div class="text-mempelai">ARIN & DITO</div>

        <div class="text-kepada">Kepada Yth.</div>
        <div id="nama-tamu" class="text-tamu">Tamu Undangan</div>
        <div class="text-maaf">Mohon maaf apabila ada kesalahan dalam penulisan nama atau gelar</div>

        <button class="btn-open" onclick="bukaUndangan()">
          <!-- SVG Daun Simpel -->
          <svg class="leaf-icon" viewBox="0 0 24 24">
            <path d="M12 2C6.5 2 3 7 3 13c0 5 4 9 9 9s9-4 9-9c0-6-3.5-11-9-11z"></path>
            <path d="M12 22V8"></path>
            <path d="M12 14l-4-3"></path>
            <path d="M12 11l4-3"></path>
            <path d="M12 18l-3-2"></path>
            <path d="M12 16l3-2"></path>
          </svg>
          <span>Open Invitation</span>
        </button>
      </div>
    </section>

    <!-- AREA UNTUK SEGMEN BERIKUTNYA -->
    <main id="main-content">
      
      <!-- SEGMEN 2: WELCOME TO OUR WEDDING -->
      <section id="section-welcome">
        
        <!-- Background Slide Loop -->
        <div class="bg-slider-container">
          <div class="bg-slider-track">
            <div class="bg-slide bg-slide-1"></div>
            <div class="bg-slide bg-slide-2"></div>
            <div class="bg-slide bg-slide-3"></div>
            <div class="bg-slide bg-slide-1"></div>
          </div>
        </div>

        <!-- Konten Utama Rata Tengah -->
        <div class="welcome-content">
          <div class="text-welcome scroll-fade">Welcome To Our Wedding</div>

          <div class="text-nama-sansilk scroll-fade">Arin & Dito</div>

          <!-- Ornamen Garis - Daun Sesuai Referensi - Garis -->
          <div class="ornament-divider scroll-fade">
            <div class="ornament-line"></div>
            <svg class="ornament-leaf-svg" viewBox="0 0 24 28">
              <!-- Bentuk Daun Luar -->
              <path d="M12 2C6.5 2 3 7.5 3 14c0 5.5 4 11 9 11s9-5.5 9-11C21 7.5 17.5 2 12 2z"></path>
              <!-- Serat Utang Tengah -->
              <path d="M12 25V6"></path>
              <!-- Cabang Serat Kiri & Kanan -->
              <path d="M12 18l-4.5-3.5"></path>
              <path d="M12 14.5l4.5-3.5"></path>
              <path d="M12 11l-3.5-3"></path>
            </svg>
            <div class="ornament-line"></div>
          </div>

          <div class="text-pembuka scroll-fade">
            Once in a while, right in the middle of an ordinary life, love gives us a fairy tale. Together with our families, we invite you to share in our joy.
          </div>
        </div>

      </section>

    </main>

  </div>

  <script>
    function ambilNamaTamu() {
      const urlParams = new URLSearchParams(window.location.search);
      let nama = urlParams.get('to');

      if (nama) {
        nama = nama.replace(/[-+]/g, ' ');
        document.getElementById('nama-tamu').textContent = nama;
      }
    }

    function bukaUndangan() {
      const cover = document.getElementById('section-cover');
      const content = document.getElementById('main-content');

      cover.classList.remove('fade-in');
      cover.classList.add('fade-out');

      setTimeout(() => {
        cover.style.display = 'none';
        content.style.display = 'block';
        content.classList.add('fade-in');
        window.scrollTo({ top: 0, behavior: 'smooth' });

        inisialisasiScrollAnimation();
      }, 750);
    }

    function inisialisasiScrollAnimation() {
      const observerOptions = {
        root: null,
        rootMargin: '0px',
        threshold: 0.15
      };

      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add('is-visible');
          } else {
            entry.target.classList.remove('is-visible');
          }
        });
      }, observerOptions);

      document.querySelectorAll('.scroll-fade').forEach(element => {
        observer.observe(element);
      });
    }

    window.addEventListener('DOMContentLoaded', () => {
      ambilNamaTamu();
      inisialisasiScrollAnimation();
    });
  </script>

</body>
</html>
